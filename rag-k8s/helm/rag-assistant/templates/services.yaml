---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-api
spec:
  selector:
    {{- include "rag-assistant.ragApi.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ragApi.port }}
      targetPort: {{ .Values.ragApi.port }}
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: rest-backend-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: rest-backend
spec:
  selector:
    {{- include "rag-assistant.restBackend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.restBackend.port }}
      targetPort: {{ .Values.restBackend.port }}
      protocol: TCP
  type: ClusterIP

---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-assistant.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.proxyTimeoutSeconds | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rest-backend-svc
                port:
                  number: {{ .Values.restBackend.port }}
          - path: /rag
            pathType: Prefix
            backend:
              service:
                name: rag-api-svc
                port:
                  number: {{ .Values.ragApi.port }}
{{- end }}
