apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-assistant.labels" . | nindent 4 }}
data:
  MODEL_NAME:        {{ .Values.config.modelName | quote }}
  EMBEDDING_MODEL:   {{ .Values.config.embeddingModel | quote }}
  CHUNK_SIZE:        {{ .Values.config.chunkSize | quote }}
  CHUNK_OVERLAP:     {{ .Values.config.chunkOverlap | quote }}
  TOP_K_RESULTS:     {{ .Values.config.topKResults | quote }}
  FAISS_INDEX_PATH:  {{ .Values.config.faissIndexPath | quote }}
  LOG_LEVEL:         {{ .Values.config.logLevel | quote }}
  REST_BACKEND_URL:  "http://rest-backend-svc:{{ .Values.restBackend.port }}"
