# ──────────────────────────────────────────────────────────────────────────────
# Global settings
# ──────────────────────────────────────────────────────────────────────────────
namespace: rag-assistant

# ──────────────────────────────────────────────────────────────────────────────
# RAG Python API
# ──────────────────────────────────────────────────────────────────────────────
ragApi:
  image:
    repository: rag-api
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  port: 8000

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Liveness / readiness probe paths (must exist in your FastAPI/Flask app)
  probes:
    liveness:  /health
    readiness: /ready

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ──────────────────────────────────────────────────────────────────────────────
# C# REST Backend
# ──────────────────────────────────────────────────────────────────────────────
restBackend:
  image:
    repository: rest-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  port: 5000

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  probes:
    liveness:  /health
    readiness: /health

# ──────────────────────────────────────────────────────────────────────────────
# Application configuration (maps to ConfigMap)
# ──────────────────────────────────────────────────────────────────────────────
config:
  modelName: "mistral"
  embeddingModel: "sentence-transformers/all-MiniLM-L6-v2"
  chunkSize: "512"
  chunkOverlap: "64"
  topKResults: "5"
  faissIndexPath: "/data/faiss_index"
  logLevel: "INFO"

# ──────────────────────────────────────────────────────────────────────────────
# Persistent storage for FAISS index
# ──────────────────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""    # leave empty to use cluster default (minikube: "standard")
  accessMode: ReadWriteOnce

# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: rag-assistant.local
  proxyTimeoutSeconds: 300

# ──────────────────────────────────────────────────────────────────────────────
# Security context (applied to all pods)
# ──────────────────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
