apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faiss-index-pvc
  namespace: rag-assistant
  labels:
    app.kubernetes.io/name: rag-assistant
    app.kubernetes.io/component: vector-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # For minikube, the default StorageClass (standard) is used automatically.
  # In production, swap for a cloud-specific StorageClass (e.g. gp3 on AWS EKS).
  # storageClassName: standard
