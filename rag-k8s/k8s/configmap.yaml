apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-assistant
  labels:
    app.kubernetes.io/name: rag-assistant
data:
  # LLM / embedding settings
  MODEL_NAME: "mistral"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "64"
  TOP_K_RESULTS: "5"

  # FAISS index path (must match PVC mount)
  FAISS_INDEX_PATH: "/data/faiss_index"

  # REST backend endpoint (cluster-internal DNS)
  REST_BACKEND_URL: "http://rest-backend-svc:5000"

  # Logging
  LOG_LEVEL: "INFO"
